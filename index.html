<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast and Furious Fanpage</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top banner -->
    <header class="header">
        <h1 class="title">Fast and Furious <span>Fanpage</span></h1>
        <p class="subtitle">Click a character to see their info</p>
    </header>

    <main class="container">
        <div class="grid">

             <!-- Card 1: Dom -->
            <div class="card" onclick="goToProfile('dom')">
                <img src="images.webp" alt="Dom">
                <span class="badge">Dom</span>
            </div>

            <!-- Card 2: Brian -->
            <div class="card" onclick="goToProfile('brian')">
                <img src="images.jpg" alt="Brian">
                <span class="badge">Brian</span>
            </div>

            <!-- Card 3: Letty -->
            <div class="card" onclick="goToProfile('letty')">
                <img src="download.jpg" alt="Letty">
                <span class="badge">Letty</span>
            </div>

            <!-- Card 4: Mia -->
            <div class="card" onclick="goToProfile('mia')">
                <img src="download (1).jpg" alt="Mia">
                <span class="badge">Mia</span>
            </div>



        </div>
    </main>

    <script>
        // When a card is clicked, open profile.html and tell it which character
        function goToProfile(id) {
            window.location.href = "profile.html?id=" + id;
        }
    </script>
</body>
</html>
