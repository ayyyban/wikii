<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Info</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="profile-page">
        <a href="index.html" class="back-btn">&larr; Back</a>

        <div class="profile-box">
            <img id="charImg" class="profile-img" src="" alt="">

            <div>
                <h1 id="charName" class="profile-name"></h1>
                <p id="charRealName" class="profile-real"></p>

                <div class="profile-info">
                    <p><strong>Birthday:</strong> <span id="charBirthday"></span></p>
                    <p><strong>Age:</strong> <span id="charAge"></span></p>
                    <p><strong>Cars:</strong> <span id="charCars"></span></p>
                    <p><strong>Role:</strong> <span id="charBio"></span></p>
                </div>

                <p id="charQuote" class="quote"></p>
            </div>
        </div>
    </div>

    <script>
        // All the character info is stored here.
        // To change something, just edit the text inside the quotes.
        const characters = {
dom: {
                name: "Dominic Toretto",
                realName: "Mark Sinclair (Vin Diesel)",
                birthday: "July 18, 1967",
                age: "59",
                cars: "1970 Dodge Charger R/T, 1993 Mazda RX-7, 2011 Dodge Charger SRT8",
                bio: "Elite street racer and leader of the Family.",
                quote: "I don't have friends, I got family.",
                img: "images.webp"
            },

            brian: {
                name: "Brian O'Conner",
                realName: "Paul Walker",
                birthday: "September 12, 1973",
                age: "Passed away at 40",
                cars: "1995 Toyota Supra, 1999 Nissan Skyline GT-R R34, Mitsubishi Lancer Evolution VII",
                bio: "Former LAPD officer and FBI agent turned crew co-leader.",
                quote: "Dude, I almost had you!",
                img: "images.jpg"
            },

              letty: {
                name: "Leticia 'Letty' Ortiz",
                realName: "Michelle Rodriguez",
                birthday: "July 12, 1978",
                age: "48",
                cars: "1970 Plymouth Barracuda, 1997 Nissan 240SX, Local Motors Rally Fighter",
                bio: "Skilled mechanic and street racer. Dom's lifelong partner.",
                quote: "You want a piece of this?",
                img: "download.jpg"
            },

            mia: {
                name: "Mia Toretto",
                realName: "Jordana Brewster",
                birthday: "April 26, 1980",
                age: "46",
                cars: "1994 Acura Integra GS-R, 2009 Alfa Romeo Giulietta",
                bio: "Dom's sister and Brian's wife. The heart of the crew.",
                quote: "You stay safe out there, okay?",
                img: "download (1).jpg"
            },
           
        };

        // Get the character id from the link (example: profile.html?id=dom)
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        // Find that character (use Dom if nothing is found)
        const char = characters[id] || characters["dom"];

        // Put the info into the page
        document.getElementById("charImg").src = char.img;
        document.getElementById("charName").innerText = char.name;
        document.getElementById("charRealName").innerText = char.realName;
        document.getElementById("charBirthday").innerText = char.birthday;
        document.getElementById("charAge").innerText = char.age;
        document.getElementById("charCars").innerText = char.cars;
        document.getElementById("charBio").innerText = char.bio;
        document.getElementById("charQuote").innerText = '"' + char.quote + '"';
    </script>
</body>
</html>
